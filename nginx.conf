server {
    # Listen on port 8080 instead of 80 so Nginx can run as non-root user
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────────
    # Security Headers
    # ──────────────────────────────────────────────

    # Prevent the page from being embedded in an iframe (anti-clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent browsers from MIME-sniffing the content type
    add_header X-Content-Type-Options "nosniff" always;

    # Enable built-in XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control how much referrer info is sent with requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — allow scripts/styles from same origin + inline
    # 'unsafe-inline' is required because React/Vite uses inline scripts and styles
    # img-src includes 'data:' for base64-encoded images (like SVGs in React)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # ──────────────────────────────────────────────
    # SPA Routing — redirect all 404s to index.html
    # so React Router can handle client-side routing
    # ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ──────────────────────────────────────────────
    # Cache static assets (JS, CSS, images) for 1 year
    # Vite adds content hashes to filenames, so this is safe
    # ──────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
