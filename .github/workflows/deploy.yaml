name: CI - Docker Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Build Docker image từ Dockerfile.dev (giống docker-compose service "test")
      - name: Build dev image from Dockerfile.dev
        run: docker build -t frontend-dev -f Dockerfile.dev .

      # Chạy test bên trong container (giống docker-compose service "test")
      - name: Run tests in container
        run: docker run --rm -e CI=true frontend-dev npm test

  build-production:
    name: Build Production Image (Docker)
    runs-on: ubuntu-latest
    needs: test  # Chỉ chạy khi test PASS

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Build production image từ Dockerfile (multi-stage: Node.js → Nginx)
      - name: Build production image from Dockerfile
        run: docker build -t frontend-prod -f Dockerfile .

      # Kiểm tra production image chạy được
      - name: Verify production image runs
        run: |
          docker run -d --name prod-test -p 8080:80 frontend-prod
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker stop prod-test
