# Workflow name displayed in the GitHub Actions tab
name: CI/CD - Docker Build, Test & Deploy to Render

# ─────────────────────────────────────────────────────────────
# TRIGGER: Define when this workflow runs
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # Run on every push to the main branch
  pull_request:
    branches:
      - main          # Also run when a Pull Request targets main
                      # (so we can catch bugs before merging)

# ─────────────────────────────────────────────────────────────
# JOBS: Define the tasks to execute
# Each job runs in an isolated virtual machine on GitHub servers
# ─────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────
  # JOB 1: TEST
  # Build the dev Docker image and run the test suite inside it
  # ───────────────────────────────────────────────────────────
  test:
    name: Build and Test (Docker)
    runs-on: ubuntu-latest    # Spin up a fresh Ubuntu virtual machine

    steps:
      # Step 1: Pull the repository source code onto the VM
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Build a Docker image using Dockerfile.dev
      #   -t frontend-dev  → tag the image as "frontend-dev"
      #   -f Dockerfile.dev → use the dev Dockerfile (Node.js + Vite)
      #   .                → build context is the current directory
      - name: Build dev image from Dockerfile.dev
        run: docker build -t frontend-dev -f Dockerfile.dev .

      # Step 3: Run the test suite inside the container
      #   --rm             → automatically remove the container after it exits
      #   -e CI=true       → tell Vitest/Jest to run once and exit (no watch mode)
      #   npm test         → executes "vitest run" defined in package.json scripts
      - name: Run tests in container
        run: docker run --rm -e CI=true frontend-dev npm test

  # ───────────────────────────────────────────────────────────
  # JOB 2: BUILD PRODUCTION
  # Build the production Docker image (multi-stage: Node → Nginx)
  # Only runs if Job 1 (test) passes
  # ───────────────────────────────────────────────────────────
  build-production:
    name: Build Production Image (Docker)
    runs-on: ubuntu-latest
    needs: test    # Dependency: this job waits for "test" to succeed first

    steps:
      # Step 1: Pull the repository source code again (each job gets a fresh VM)
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Build the production Docker image using the multi-stage Dockerfile
      #   Stage 1 (builder): Node.js → runs "npm run build" → outputs /app/dist
      #   Stage 2 (serve):   Nginx   → copies /app/dist to serve as static files
      - name: Build production image from Dockerfile
        run: docker build -t frontend-prod -f Dockerfile .

      # Step 3: Verify the production image actually works
      #   -d               → run container in background (detached mode)
      #   --name prod-test → name the container for easy reference
      #   -p 8080:8080     → map host port 8080 to Nginx container port 8080
      #                      (Nginx listens on 8080 for non-root compatibility)
      #   sleep 3          → wait 3 seconds for Nginx to fully start
      #   curl -f          → make an HTTP GET to localhost:8080
      #                      -f flag: fail silently with exit code != 0 on error
      #   || exit 1        → if curl fails, stop the workflow with an error
      #   docker stop      → clean up the test container after verification
      - name: Verify production image runs
        run: |
          docker run -d --name prod-test -p 8080:8080 frontend-prod
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker stop prod-test

  # ───────────────────────────────────────────────────────────
  # JOB 3: DEPLOY TO RENDER
  # Trigger a deployment on Render.com via its Deploy Hook URL
  # Only runs if BOTH test AND build-production pass,
  # AND only on a direct push to main (not on Pull Requests)
  # ───────────────────────────────────────────────────────────
  deploy-to-render:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: [test, build-production]    # Both previous jobs must succeed

    # Guard condition: only deploy on actual push to main, not on PR events.
    # This prevents a PR from triggering a production deployment before it is merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Call the Render Deploy Hook URL using curl
      #   The Deploy Hook is a unique URL provided by Render in Service Settings.
      #   Calling it tells Render to pull the latest code and redeploy the service.
      #   The URL is stored as a GitHub Secret (RENDER_DEPLOY_HOOK_URL)
      #   so it is never exposed in the repository or logs.
      #   -f flag: exit with error if the HTTP request fails
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering deployment to Render.com..."
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || exit 1
          echo "Deploy triggered successfully!"
